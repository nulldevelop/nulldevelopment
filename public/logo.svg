<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="70%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="borderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#555555" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#444" stroke-width="0.5" opacity="0.4"/>

  <!-- Main circle background -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGlow)"/>

  <!-- Border gradient -->
  <circle cx="60" cy="60" r="56" fill="url(#borderGlow)"/>

  <!-- "nd" text -->
  <text
    x="60"
    y="68"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
    fill="white"
    letter-spacing="-1"
    filter="url(#softGlow)"
  >nd</text>

  <!-- Gold diamond -->
  <polygon
    points="60,84 65,89 60,94 55,89"
    fill="#C9A84C"
  />
</svg>
