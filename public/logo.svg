<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#3a3a3a" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer subtle ring -->
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- Circle background -->
  <circle cx="60" cy="60" r="57" fill="url(#bg)"/>

  <!-- Edge gradient -->
  <circle cx="60" cy="60" r="57" fill="url(#edge)"/>

  <!-- nd text with glow -->
  <text
    x="60"
    y="72"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="700"
    fill="white"
    letter-spacing="-2"
    filter="url(#glow)"
  >nd</text>

  <!-- Gold diamond -->
  <polygon points="60,86 65,91 60,96 55,91" fill="#C9A84C"/>
</svg>
